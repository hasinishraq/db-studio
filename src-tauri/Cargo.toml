[package]
name = "studio-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
name = "studio_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["specta"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-specta.workspace = true
specta.workspace = true
specta-typescript.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
async-trait.workspace = true
secrecy.workspace = true
chrono.workspace = true
rustls.workspace = true
studio-types.workspace = true
studio-db.workspace = true
studio-safety.workspace = true
studio-session.workspace = true
studio-store.workspace = true
driver-postgres.workspace = true
driver-mysql.workspace = true
driver-sqlite.workspace = true
studio-ai.workspace = true
studio-tunnel.workspace = true
dashmap.workspace = true
csv = "1"
rust_xlsxwriter = { version = "0.102", features = ["constant_memory"] }
uuid.workspace = true
svg2pdf = { version = "0.13", default-features = false, features = ["text"] }
resvg = { version = "0.45.1", default-features = false, features = ["text"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }

[dev-dependencies]
russh.workspace = true
rand.workspace = true
tempfile.workspace = true
insta.workspace = true
studio-session = { workspace = true, features = ["testing"] }
