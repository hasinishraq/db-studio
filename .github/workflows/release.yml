name: Release
on:
  push: { tags: ["v*"] }

permissions:
  contents: write

jobs:
  release:
    # Releases are built for Windows only for now (MSI and NSIS installers).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "DB Studio ${{ github.ref_name }}"
          releaseBody: |
            DB Studio is a desktop client for PostgreSQL, MySQL, MariaDB and SQLite, with an AI assistant that runs safe reads by itself and changes data only after you approve the exact statement.

            ## Download (Windows only)

            - **`..._x64-setup.exe`**: the recommended installer.
            - **`..._x64_en-US.msi`**: for managed or silent installs.

            macOS and Linux builds are not published yet. You can build from source; see the README.

            ## Documentation

            - User guide: https://hasinishraq.github.io/db-studio-documentation/user-guide/
            - Full documentation: https://hasinishraq.github.io/db-studio-documentation/

            **Full list of commits:** https://github.com/${{ github.repository }}/commits/${{ github.ref_name }}
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-rc') }}
